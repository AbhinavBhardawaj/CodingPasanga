{% extends "layout.html" %}
{% load static %}

{% block title %} Forgot pswd - CodingPasanGa {% endblock %}

{% block content %}
    <nav class="flex flex-wrap items-center justify-between bg-black px-6 py-3 relative">

        <a href="{% url 'home' %}">
            <img src="{% static 'CodingPasanga.png' %}" alt="" class="h-12">
        </a>
        <video src="{% static 'cp1.mp4' %}" autoplay loop muted playsinline class="h-6 w-auto  mx-auto"></video>
    </nav>


    <div style="width: 450px;" class="mt-20 flex flex-col items-center justify-center rounded-2xl mt-10 mx-auto bg-[#ffffff0d] border border-[#3D3D3D] p-6 px-5 py-4 text-white text-center ">
        <img src="{% static "CodingPasanga.png" %}" alt="" class="h-12 rounded-full"><br>
        <div>
            <h1 class="-mt-3 font-semibold">Fir bhool Gaye(Forgotted Again)?</h1>
            <h2 class="text-gray-400">Lost Again?Do faster than mummy's kutai!</h2>
        </div>

        <div class="flex justify-center mt-10">
            <form action="" method="POST">
                {% csrf_token %}
                <div class="relative w-full max-w-sm mt-1">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                    <i class="fa-solid fa-envelope relative"></i> 
                    </div>
                    <input name="email" type="email" required placeholder="dalal@gmail.com" class="w-[350px] pl-10 pr-3 py-2 rounded-xl border border-gray-500 bg-transparent text-white placeholder-gray-400 focus:outline-none focus:border-blue-500">   
                </div>
                
                <button type="submit" class="mt-4 py-3 w-full rounded-2xl text-white bg-violet-600 font-semibold">
                    Reset Password
                </button>
                <div class="mt-1">

                    <a href="{% url 'login' %}"> 
                        <i class="fa-solid fa-circle-chevron-left"></i>
                        <span class="ml-2">Back to Login</span>
                    </a>
                </div>
            </form>    
        </div>
    </div>

    
{% endblock %}
